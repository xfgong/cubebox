{{- $pgHost := include "cubeplex.postgresql.host" . -}}
{{- $redisHost := include "cubeplex.redis.host" . -}}
{{- $rustfsHost := include "cubeplex.rustfs.host" . -}}
{{- $doclingHost := include "cubeplex.docling.host" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cubeplex.backend.fullname" . }}-config
  labels:
    {{- include "cubeplex.labels" . | nindent 4 }}
data:
  config.production.local.yaml: |
    dynaconf_merge: true
    production:
      {{- with .Values.backend.configOverrides }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      database:
        host: {{ $pgHost | quote }}
        port: 5432
        user: {{ .Values.postgres.auth.username | quote }}
        name: {{ .Values.postgres.auth.database | quote }}
      objectstore:
        provider: "s3"
        endpoint: {{ printf "http://%s:9000" $rustfsHost | quote }}
        bucket: {{ .Values.rustfs.defaultBucket | quote }}
        region: "us-east-1"
      sandbox:
        # The bundled chart or an external endpoint must provide OpenSandbox.
        enabled: true
        use_server_proxy: {{ dig "sandbox" "use_server_proxy" false .Values.backend }}
        # Panels flow through cubeplex's token-authed panel reverse proxy (not the
        # OpenSandbox ingress gateway), so signed secured-endpoint mode is off.
        secure_access: {{ dig "sandbox" "secure_access" false .Values.backend }}
        {{- if .Values.egress.enabled }}
        # Activates egress secret-injection in SandboxManager (every
        # injection call is gated on `if self._exchange_host:`) and is
        # force-allowed in the sandbox's egress network policy. Defaults to
        # the same host the sandbox-side mitmproxy addon actually connects to
        # (see egress-webhook-deployment.yaml's exchangeURL default).
        egress_exchange_host: {{ dig "sandbox" "egress_exchange_host" (printf "%s.%s.svc.cluster.local" (include "cubeplex.backend.fullname" .) .Release.Namespace) .Values.backend }}
        {{- end }}
      {{- if .Values.docling.enabled }}
      parsers:
        docling_serve:
          base_url: {{ printf "http://%s:%v" $doclingHost .Values.docling.service.port | quote }}
      {{- end }}
      {{- if .Values.egress.enabled }}
      egress_exchange:
        auth:
          mode: mtls
        listener:
          enabled: true
          host: "0.0.0.0"
          port: 8443
          certfile: "/etc/egress-mtls/tls.crt"
          keyfile:  "/etc/egress-mtls/tls.key"
          ca_certs: "/etc/egress-mtls/ca.crt"
      {{- end }}
