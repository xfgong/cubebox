# CubePlex single-host docker-compose deployment.
#
# Variables come from .env (operator copies from .env.example). Images
# default to the public prebuilt releases on GHCR
# (ghcr.io/cubeplexai/cubeplex-{backend,frontend}); override IMAGE_REGISTRY /
# IMAGE_REPO in .env to use a private mirror or a self-built image.
#
# Quick start:
#   cp .env.example .env
#   cp config/config.production.local.yaml.example config/config.production.local.yaml
#   cp config/config.production.secrets.yaml.example config/config.production.secrets.yaml
#   cp config/opensandbox.toml.example config/opensandbox.toml
#   $EDITOR .env config/config.production.{local,secrets}.yaml config/opensandbox.toml
#   docker compose up -d
#
# All services share the default network. Backend is reachable as
# `backend:8000` from frontend; frontend serves the user on host port
# ${FRONTEND_PORT:-3000} and proxies /api/* to backend internally.

name: cubeplex

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  postgres:
    # Custom image: postgres:18 + PGroonga (CJK full-text) + pgvector (HNSW
    # vector search). Required by the conversation-search feature; falling
    # back to plain postgres breaks the alembic migration that does
    # `CREATE EXTENSION pgroonga / vector`.
    image: cubeplex/postgresql-pgroonga-pgvector:18.2-pgroonga4.0.6-pgvector0.8.2
    <<: *restart-policy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cubeplex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cubeplex}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubeplex} -d ${POSTGRES_DB:-cubeplex}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      --appendonly yes
      --dir /data
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object store. We use rustfs (smaller / pure-Rust) over
  # minio for the compose mode. config.production.secrets.yaml points
  # the backend at this endpoint.
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    <<: *restart-policy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cubeplex}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot bucket create. mc speaks S3 so it works against rustfs too.
  # Idempotent — `mc mb --ignore-existing` is a no-op when the bucket exists.
  bucket-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cubeplex}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      BUCKET: ${OBJECTSTORE_BUCKET:-cubeplex}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        until mc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          echo "waiting for rustfs..."; sleep 2
        done
        mc mb --ignore-existing "local/$$BUCKET"
        echo "bucket $$BUCKET ready"
    restart: "no"

  # Alembic migrate. Runs to completion before backend starts.
  backend-migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-cubeplexai}/cubeplex-backend:${BACKEND_TAG:?set BACKEND_TAG in .env}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV_FOR_DYNACONF: production
    volumes:
      - ./config/config.production.local.yaml:/app/config.production.local.yaml:ro
      - ./config/config.production.secrets.yaml:/app/config.production.secrets.yaml:ro
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-cubeplexai}/cubeplex-backend:${BACKEND_TAG}
    <<: *restart-policy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
      opensandbox-server:
        condition: service_healthy
    environment:
      ENV_FOR_DYNACONF: production
    volumes:
      - ./config/config.production.local.yaml:/app/config.production.local.yaml:ro
      - ./config/config.production.secrets.yaml:/app/config.production.secrets.yaml:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # OpenSandbox is required for agent tool execution. It creates sibling
  # sandbox containers through the host Docker daemon; do not expose this API
  # outside the private compose network.
  opensandbox-server:
    image: ${OPENSANDBOX_IMAGE:-opensandbox/server:v0.2.2}
    <<: *restart-policy
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/opensandbox.toml:/etc/opensandbox/config.toml:ro
    ports:
      - "${OPENSANDBOX_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-cubeplexai}/cubeplex-frontend:${FRONTEND_TAG:?set FRONTEND_TAG in .env}
    <<: *restart-policy
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Frontend's Next.js server proxies /api/* server-side to this URL.
      CUBEPLEX_API_URL: "http://backend:8000"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
