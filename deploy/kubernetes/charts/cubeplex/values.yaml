# CubePlex umbrella chart — DEFAULTS ONLY.
# Real secrets, model api_keys, OSS keys, and the operator-specific sandbox
# image / domain live in `values.local.yaml` (gitignored).
#
# Apply with: helm upgrade --install cubeplex ./deploy/charts/cubeplex \
#               -n cubeplex --create-namespace \
#               -f values.yaml -f values.local.yaml

global:
  imageRegistry: "ghcr.io"
  imagePullSecrets: []

image:
  # Defaults pull the public prebuilt release images
  # (ghcr.io/cubeplexai/cubeplex-{backend,frontend}). Override for a private
  # mirror or a self-built image (deploy/kubernetes/scripts/build-and-push.sh).
  registry: "ghcr.io"
  repository: cubeplexai
  pullPolicy: IfNotPresent
  # Tag is optional: it defaults to "v<Chart.appVersion>", so a released chart
  # already points at the matching images. Override only for a self-built image
  # (deploy/kubernetes/scripts/build-and-push.sh) or to pin a different version.
  backend:
    name: cubeplex-backend
    tag: ""
  frontend:
    name: cubeplex-frontend
    tag: ""

backend:
  replicaCount: 1
  service:
    port: 8000
  # Sandbox execution is required. Use an external OpenSandbox endpoint by
  # setting opensandbox.enabled=false and backend.secrets.sandbox.domain.
  sandbox:
    use_server_proxy: false
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  env:
    ENV_FOR_DYNACONF: production
  # Anything here is rendered into the ConfigMap as YAML overrides applied
  # AFTER config.production.yaml. Use for non-secret deployment-specific
  # tuning. Secrets live under `backend.secrets` below.
  configOverrides:
    api:
      host: "0.0.0.0"
      port: 8000
      # Also the origin for the sandbox browser/terminal panels: it must be
      # browser-reachable AND forward WebSocket (panels proxy Neko/ttyd over WS).
      public_url: "http://cubeplex.local"
    deployment:
      mode: single_tenant
    public_base_url: "http://cubeplex.local"
    frontend_base_url: "http://cubeplex.local"
  # ALL secret fields go into a k8s Secret. Operator fills these in
  # values.local.yaml; the chart fails the install if jwt_secret/csrf_secret
  # are still empty.
  secrets:
    auth:
      jwt_secret: ""
      csrf_secret: ""
      vault_key: ""
    llm:
      providers: {}
    sandbox:
      api_key: ""

frontend:
  replicaCount: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "cubeplex.local"
  tls:
    enabled: false
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "60m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# Storage class for CubePlex's PVCs. Points at /work (1.8 T) on node-1 so
# we don't fill the 51 G root partition where the default openebs SC lives.
storageClass:
  create: true
  name: cubeplex-work-hostpath
  basePath: /work/cubeplex

# ── Bundled infrastructure (single-node defaults) ───────────────────────
postgres:
  enabled: true
  # Custom image: postgres:18 + PGroonga (CJK full-text) + pgvector (HNSW
  # vector search). Required by conversation-search; plain postgres won't
  # pass the alembic migration that does `CREATE EXTENSION pgroonga / vector`.
  image: cubeplex/postgresql-pgroonga-pgvector:18.2-pgroonga4.0.6-pgvector0.8.2
  auth:
    username: cubeplex
    database: cubeplex
    password: ""      # required in values.local.yaml
  persistence:
    storageClass: cubeplex-work-hostpath
    size: 8Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

redis:
  enabled: true
  image: redis:7-alpine
  auth:
    password: ""      # required in values.local.yaml
  persistence:
    storageClass: cubeplex-work-hostpath
    size: 2Gi
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.0-beta.4
  mcImage: minio/mc:RELEASE.2025-04-08T15-39-49Z
  auth:
    accessKey: cubeplex
    secretKey: ""  # required in values.local.yaml
  defaultBucket: cubeplex
  persistence:
    storageClass: cubeplex-work-hostpath
    size: 20Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── Docling document-conversion service (optional) ──────────────────────
# The backend's DoclingParser (config key parsers.docling_serve.base_url)
# calls this to convert PDF/office files to markdown. When enabled, the
# backend ConfigMap is auto-pointed at the in-cluster Service; leave it off
# to disable docling parsing or to point at an external endpoint via
# backend.configOverrides.parsers.docling_serve.base_url.
docling:
  enabled: false
  # CPU image. For GPU, swap to docling-serve-cu130 and add GPU resources /
  # nodeSelector under docling.resources.
  image: ghcr.io/docling-project/docling-serve-cpu:v1.16.1
  replicaCount: 1
  service:
    port: 5001
  # Models are downloaded once by an initContainer into this PVC and reused
  # across restarts (single replica; the PVC is ReadWriteOnce).
  persistence:
    storageClass: cubeplex-work-hostpath
    size: 15Gi
  # Extra env applied to both the model-download initContainer and the serve
  # container. Set HF_ENDPOINT: https://hf-mirror.com (and HF_TOKEN) for
  # mainland-China HuggingFace mirrors.
  env: {}
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# ── Egress secret-injection (MITM webhook + backend mTLS exchange) ───────
# Default off. Turning on:
#   - deploys the mutating admission webhook in this (cubeplex) namespace
#   - copies the addon ConfigMap + MITM CA Secret into `sandboxNamespace`
#   - enables the backend's mTLS egress_exchange listener on :8443
#   - mounts a backend server cert + trust CA signed by a chart-generated
#     CA (long-lived, never rotated automatically — kept across upgrades)
#
# Sandbox pods get patched at admission to:
#   - mount the per-sandbox client cert minted by the webhook
#   - load the inject.py mitmproxy addon
#   - call the backend's :8443 exchange to swap cbxref_<id> placeholders
#     for real secret values, just-in-time, per outbound request.
egress:
  enabled: false
  # Namespace where sandbox pods live (where the MutatingWebhookConfiguration
  # matches and where the addon ConfigMap + MITM CA Secret are mirrored).
  # NOT the same as where opensandbox-server/-controller themselves run
  # ("opensandbox-system") — per-conversation sandbox pods run wherever the
  # server's own configToml [kubernetes] namespace points, which defaults to
  # "opensandbox" in the bundled subchart (vendor/opensandbox-server's own
  # values.yaml). Getting this wrong means the MutatingWebhookConfiguration's
  # namespaceSelector never matches real sandbox pods — and with
  # failurePolicy: Ignore, that failure is completely silent.
  sandboxNamespace: "opensandbox"
  webhook:
    replicaCount: 1
    image:
      registry: ""                     # falls back to .Values.image.registry
      repository: ""                   # falls back to .Values.image.repository
      name: cubeplex-egress-webhook
      tag: ""                          # optional; defaults to "v<Chart.appVersion>"
      pullPolicy: ""                   # falls back to .Values.image.pullPolicy
    # MUST match the OpenSandbox server's configured egress.image exactly
    # (the webhook narrow-matches sandbox pods by ownerReference + egress
    # container image).
    egressImage: ""
    # Exchange URL injected into each sandbox sidecar; default points at
    # this release's backend Service on :8443. Override only if the
    # backend is reachable at a non-cluster-internal address.
    exchangeURL: ""
    # Per-sandbox client cert TTL (minutes). Must exceed max sandbox lifetime.
    clientCertTTLMinutes: 720
    # Override the MutatingWebhookConfiguration's namespaceSelector when
    # the simple `kubernetes.io/metadata.name = sandboxNamespace` rule
    # isn't enough (e.g. sandbox pods spread across many namespaces).
    namespaceSelector: {}
    resources:
      requests: { cpu: "50m",  memory: "64Mi" }
      limits:   { cpu: "200m", memory: "256Mi" }

# ── OpenSandbox umbrella subchart (alibaba) ──────────────────────────────
opensandbox:
  enabled: true
  # Inherits defaults from the upstream chart; only override surface knobs
  # we care about for the smoke test deployment.
  opensandbox-server:
    server:
      replicaCount: 1
  opensandbox-controller:
    controller:
      replicaCount: 1
